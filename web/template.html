<meta name="description" content="Four daily K-pop girl group puzzles: name the idol, the group, the face or the song.">

<body>
<div class="wrap">

            aria-label="Past days">&#8630;</button>

            aria-label="Statistics">&#9636;</button>

  <div class="bar">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const DATA = /*__DATA__*/{"members":[],"groups":[],"songs":[],"epoch":"2026-01-01","schedules":{}};

/* ==================================================================
   constants
   ================================================================== */
const SAVE = "kpopdle:v1";
const MAX_GUESSES = 8;          // grid modes
const MAX_REVEAL  = 6;          // face + song modes
const STEPS = [1, 2, 4, 7, 11, 16];   // seconds unlocked per wrong guess

/* Display-only formatters. These never touch grading — "SM Entertainment" and
   "SM" grade identically because the comparison reads the raw field. */
const ordinal = n => n + (["th","st","nd","rd"][(n%100-n%10!=10)*(n%10)] || "th");
const shortLabel = v => String(v).replace(/ Entertainment$/, "");

/* Grading tolerance for numeric columns. Stated in the legend so "near"
   always means a specific thing — a vague "close" is worse than no hint. */
const MEMBER_COLS = [
  {k:"group",       label:"Group",    kind:"exact"},
  {k:"company",     label:"Company",  kind:"company", fmt:shortLabel},
  {k:"nationality", label:"From",     kind:"set"},
  {k:"gen",         label:"Gen",      kind:"num", tol:0, fmt:ordinal},
  {k:"size",        label:"Members",  kind:"num", tol:1},
  {k:"debut",       label:"Debut",    kind:"num", tol:2},
  {k:"birth",       label:"Born",     kind:"num", tol:2},
  {k:"status",      label:"Status",   kind:"exact"}
];
const GROUP_COLS = [
  {k:"company", label:"Company",    kind:"company", fmt:shortLabel},
  {k:"gen",     label:"Gen",        kind:"num", tol:0, fmt:ordinal},
  {k:"debut",   label:"Debut",      kind:"num", tol:2},
  {k:"size",    label:"Members",    kind:"num", tol:1},
  {k:"foreign", label:"Non-Korean", kind:"num", tol:1},
  {k:"status",  label:"Status",     kind:"exact"}
];

const MODES = {
  member:{pool:()=>DATA.members, cols:MEMBER_COLS, kind:"grid",
          ph:"Type an idol name…", max:MAX_GUESSES,
          help:"Guess the idol. Every guess is scored against eight facts about her."},
  group: {pool:()=>DATA.groups,  cols:GROUP_COLS,  kind:"grid",
          ph:"Type a group name…", max:MAX_GUESSES,
          help:"Guess the group. Six columns of feedback per guess."},
  image: {pool:()=>DATA.members.filter(m=>m.img||(m.imgs&&m.imgs.length)), kind:"image",
          ph:"Who is she?", max:MAX_REVEAL,
          help:"A photocard sits in a frosted sleeve. Each wrong guess slides it further out, revealing another band from the bottom up."},
  song:  {pool:()=>DATA.songs,   kind:"song",
          ph:"Name the song…", max:MAX_REVEAL,
          help:"Listen and name the song. You start with one second; each miss buys you more."}
};

/* ==================================================================
   small helpers
   ================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase()
  .normalize("NFKD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9가-힣]/g,"");

/* Cover art is stored as Deezer's 32-character hash; the URL is 85 characters
   and there are 3,300 of them. */
const ART = h => h
  ? "https://e-cdns-images.dzcdn.net/images/cover/" + h + "/500x500-000000-80-0-0.jpg"
  : "";
/* A song's Korean name, tier and generation belong to its artist, so they are
   read from the group rather than copied onto every track. */
function ownerOf(item){
  return groupByName[item.group] || null;
}

function commons(file, width){
  if(!file) return "";
  return "https://commons.wikimedia.org/wiki/Special:FilePath/"
       + encodeURIComponent(file.replace(/ /g,"_")) + "?width=" + (width||400);
}
/* Stage photos (Commons, via build/fetch_photos.py) with the P18 portrait as
   the floor. Two reasons the fallback is not optional: 91 members have no stage
   photo at all, and Commons filenames rot — files get renamed and deleted,
   while P18 is maintained by editors. */
function photoOf(item, n){
  const list = item && item.imgs;
  if(!list || !list.length) return item ? item.img : null;
  return list[(((n|0) % list.length) + list.length) % list.length];
}
/* Daily must look the same for everyone, so it indexes by the day. Endless
   varies, so a member you have seen before turns up in a different photo. */
function photoSeed(){
  return S.play === "daily" ? shownDay() : S.photoPick;
}
/* Face mode showed the SAME photo as the thumbnail beside her name, so you
   could scroll the suggestion list and match the picture without spending a
   guess. The puzzle takes the next photo in her set instead — a different one
   whenever she has more than one. */
function puzzleSeed(){ return photoSeed() + 1; }
function imgTag(item, cls, width, alt, seed){
  const pick = photoOf(item, seed == null ? photoSeed() : seed);
  if(!pick) return "";
  // Prefer the P18 portrait as the fallback — editors maintain it. A couple of
  // members have stage photos but no portrait at all, so for them the next
  // stage photo stands in rather than leaving a broken image with no recovery.
  const alt2 = (item.imgs || []).find(f => f !== pick);
  const fbFile = (item.img && item.img !== pick) ? item.img : alt2;
  const fb = fbFile ? commons(fbFile, width) : "";
  return `<img class="${cls}" src="${esc(commons(pick,width))}" alt="${esc(alt||"")}"`
    + (fb ? ` data-fb="${esc(fb)}" onerror="this.onerror=null;this.src=this.dataset.fb"` : "")
    + ` loading="lazy">`;
}

/* A picture for the picker that is NOT the one on the card.
 *
 * Most idols have both a P18 portrait and stage photography, and the Face card
 * always uses a stage photo — so the portrait is a genuinely different picture
 * of the same person. That is the useful thing to show: you can still compare
 * a face against the card, but you have to actually recognise her rather than
 * spot two copies of one image.
 *
 * 69 of the 201 idols in the pool have only a single picture. They get no
 * thumbnail rather than a free answer. That leaks nothing — a missing
 * thumbnail says nothing about whether she is today's answer.
 */
function pickerPhoto(item){
  const onCard = photoOf(item, puzzleSeed());
  const options = (item.img ? [item.img] : []).concat(item.imgs || []);
  return options.find(f => f && f !== onCard) || null;
}

function thumbFor(item){
  if(MODE()==="song") return ART(item.art);
  if(MODE()==="image"){
    const alt = pickerPhoto(item);
    return alt ? commons(alt, 90) : "";
  }
  const pick = photoOf(item, photoSeed());
  return pick ? commons(pick,90) : "";
}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}

/* ==================================================================
   state
   ================================================================== */
const S = {
  mode:"member", play:"daily", day:0,
  viewDay:null,           // archive: a past day being replayed, else null
  answer:null, guesses:[], done:false, won:false, skipped:0,
  audio:null, playing:false, endlessSeed:{},
  volume:0.8,
  hints:[],               // hints revealed this round
  photoPick:0,            // which stage photo this endless round shows
  filters:null            // endless-only pool narrowing, filled by init()
};
const MODE = () => S.mode;
const CFG  = () => MODES[S.mode];
const MAXG = () => CFG().max;

/* ==================================================================
   theme
   ================================================================== */
const THEMES = ["bubblegum", "soda", "arena"];
const THEME_KEY = "biasdle.theme";

const THEME_BG = {bubblegum:"#FFF1F7", soda:"#ECF8FB", arena:"#0B0711"};
function applyTheme(name){
  const t = THEMES.includes(name) ? name : THEMES[0];
  document.documentElement.setAttribute("data-theme", t);
  // Colours the phone's status bar to match, instead of leaving a white strip
  // above a dark page.
  document.querySelectorAll('meta[name="theme-color"]').forEach(m =>
    m.setAttribute("content", THEME_BG[t]));
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  document.querySelectorAll(".swatch").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.theme === t)));
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved || THEMES[0]);
  document.querySelectorAll(".swatch").forEach(b =>
    b.onclick = () => applyTheme(b.dataset.theme));
}

/* ==================================================================
   endless filters

   Daily is fixed for everyone, so these only narrow Endless. The pattern is
   digimondle's: toggles that all default to "on", a live count of what
   survives, and a fallback to the whole pool if a combination leaves nothing —
   dealing from an empty pool would hand the player a broken round.
   ================================================================== */
const VOL_KEY = "biasdle.volume";
function loadVolume(){
  try{
    const v = parseFloat(localStorage.getItem(VOL_KEY));
    return (v >= 0 && v <= 1) ? v : 0.8;
  }catch(e){ return 0.8; }
}
function setVolume(v){
  S.volume = Math.max(0, Math.min(1, v));
  if(S.audio) S.audio.volume = S.volume;
  try{ localStorage.setItem(VOL_KEY, String(S.volume)); }catch(e){}
}

const FILTER_KEY = "biasdle.filters";
// 2 is here only because of soloists: IU (2008), HyunA (2010) and Sunmi
// (2013) predate the gen-3 floor the group roster uses.
const GENS = [2, 3, 4, 5];
const TIERS = [
  {v:1, label:"Household names"},
  {v:2, label:"If you follow K-pop"},
  {v:3, label:"Deep cuts"}
];
/* Asked for by name: one press narrows Endless to that group, both presses
   give you both. They are ordinary group filters with a shortcut button. */
const PINNED = ["TWICE", "LE SSERAFIM"];

const defaultFilters = () => ({
  gens: GENS.slice(),
  tiers: TIERS.map(t => t.v),
  groups: [],            // empty = every group
  former: true,          // include members who have left
  disbanded: true,       // include disbanded / inactive groups
  singlesOnly: false     // song mode: title tracks only, no album cuts
});

function loadFilters(){
  const d = defaultFilters();
  try{
    const f = JSON.parse(localStorage.getItem(FILTER_KEY));
    if(!f) return d;
    return {
      gens:  Array.isArray(f.gens)  ? f.gens.filter(g => GENS.includes(g)) : d.gens,
      tiers: Array.isArray(f.tiers) ? f.tiers.filter(t => t>=1 && t<=3)    : d.tiers,
      // Deliberately NOT restored. Generation, fame and the include-switches
      // are standing preferences; picking a specific group is a "right now"
      // action, and reloading into it weeks later reads as though Endless has
      // always been that narrow. Endless starts on the full pool.
      groups: [],
      former: f.former !== false,
      disbanded: f.disbanded !== false,
      singlesOnly: !!f.singlesOnly
    };
  }catch(e){ return d; }
}
function saveFilters(){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify(S.filters)); }catch(e){}
}

const groupByName = {};
function passes(item, f){
  if(f.groups.length && f.groups.indexOf(item.group || item.name) < 0) return false;
  const g = groupByName[item.group || item.name];
  // Soloists carry their own generation and tier — there is no group to read
  // them from — so prefer the item's own fields and fall back to the group's.
  const own  = g || groupByName[item.group];
  const gen  = item.gen  != null ? item.gen  : (own ? own.gen  : null);
  const tier = item.tier != null ? item.tier : (own ? own.tier : null);
  if(gen  != null && f.gens.indexOf(gen)   < 0) return false;
  if(tier != null && f.tiers.indexOf(tier) < 0) return false;
  if(!f.disbanded && g && g.status !== "Active") return false;
  if(!f.former && item.status === "Left") return false;
  if(f.singlesOnly && item.track && !item.single) return false;
  return true;
}

function dayIndex(){
  const [y,m,d] = DATA.epoch.split("-").map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - start)/86400000);
}
function byId(mode,id){
  const p = MODES[mode].pool();
  return p.find(x=>x.id===id) || null;
}
function dailyAnswer(mode, day){
  const sched = DATA.schedules[mode] || [];
  if(!sched.length) return MODES[mode].pool()[0]||null;
  const id = sched[((day % sched.length)+sched.length)%sched.length];
  return byId(mode,id) || MODES[mode].pool()[0] || null;
}

/* ---- storage ---- */
const loadStore = () => { try{ return JSON.parse(localStorage.getItem(SAVE))||{}; }
                          catch(e){ return {}; } };
const saveStore = o => { try{ localStorage.setItem(SAVE, JSON.stringify(o)); }catch(e){} };

/* The day the board is showing. Normally today; in the archive, whichever past
   day the player picked. Everything that keys off a day reads this, so a
   replayed day saves and scores under its own key instead of overwriting
   today's round. */
function shownDay(){ return S.viewDay == null ? S.day : S.viewDay; }

function stateKey(){
  return S.mode + ":" + (S.play==="daily" ? "d"+shownDay() : "e");
}

function persist(){
  const st = loadStore();
  st.rounds = st.rounds || {};
  st.rounds[stateKey()] = {
    a:S.answer?S.answer.id:null,
    g:S.guesses.map(x=>x&&x.id?x.id:"~skip"),
    d:S.done, w:S.won, h:S.hints.length
  };
  // Keep the file small: daily rounds older than 30 days are dead weight.
  Object.keys(st.rounds).forEach(k=>{
    const m = /:d(-?\d+)$/.exec(k);
    if(m && S.day - (+m[1]) > 30) delete st.rounds[k];
  });
  saveStore(st);
}

/* ---- stats ---- */
const blankStats = () => ({played:0, won:0, streak:0, best:0, last:null, dist:{}});
function statsFor(mode){
  const st = loadStore();
  return Object.assign(blankStats(), (st.stats||{})[mode]);
}
function recordResult(won, tries){
  // Archive rounds are practice. Counting them would let anyone manufacture a
  // 365-day streak in an afternoon.
  if(S.play!=="daily" || S.viewDay != null) return;
  const st = loadStore();
  st.stats = st.stats || {};
  const s = Object.assign(blankStats(), st.stats[S.mode]);
  if(s.last === S.day) { st.stats[S.mode]=s; saveStore(st); return; }
  s.played++;
  if(won){
    s.won++;
    s.streak = (s.last === S.day-1) ? s.streak+1 : 1;
    s.best = Math.max(s.best, s.streak);
    s.dist[tries] = (s.dist[tries]||0)+1;
  } else {
    s.streak = 0;
  }
  s.last = S.day;
  st.stats[S.mode] = s;
  saveStore(st);
}

/* ==================================================================
   grading
   ================================================================== */
function gExact(g,a){ return {r: g===a ? "hit" : "miss"}; }

function gNum(g,a,col){
  if(g===a) return {r:"hit"};
  const tol = col.tol==null ? 0 : col.tol;
  const near = Math.abs(g-a) <= tol && tol>0;
  return {r: near?"near":"miss", dir: g<a ? "up" : "down"};
}
function gSet(g,a){
  const G=[].concat(g), A=[].concat(a);
  const same = G.length===A.length && G.every(x=>A.indexOf(x)>=0);
  if(same) return {r:"hit"};
  return {r: G.some(x=>A.indexOf(x)>=0) ? "near" : "miss"};
}
/* Company is "near" when two different labels sit under one conglomerate —
   Source Music vs ADOR are both HYBE, and that is a real hint. */
function gCompany(guess,ans){
  if(guess.company===ans.company) return {r:"hit"};
  return {r: guess.parent===ans.parent ? "near" : "miss"};
}
function grade(guess, ans, col){
  if(col.kind==="company") return gCompany(guess,ans);
  const g=guess[col.k], a=ans[col.k];
  if(col.kind==="num")   return gNum(g,a,col);
  if(col.kind==="set")   return gSet(g,a);
  return gExact(g,a);
}

/* ==================================================================
   round lifecycle
   ================================================================== */
function endlessPool(){
  const all = CFG().pool();
  if(!S.filters) return all;
  const kept = all.filter(x => passes(x, S.filters));
  // Never deal from nothing. Widening is the player's job; refusing to start
  // a round is not an acceptable way to tell them the filters are too tight.
  return kept.length ? kept : all;
}

function pickEndless(){
  const pool = endlessPool();
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function startRound(restore){
  stopAudio();
  S.guesses=[]; S.done=false; S.won=false; S.skipped=0; S.hints=[];
  S.photoPick = Math.floor(Math.random()*1000);
  S.day = dayIndex();

  if(S.play==="daily"){
    S.answer = dailyAnswer(S.mode, shownDay());
  } else {
    S.answer = pickEndless();
  }

  if(restore){
    const saved = (loadStore().rounds||{})[stateKey()];
    if(saved && saved.a){
      const a = byId(S.mode, saved.a);
      // An endless round only resumes if its answer still exists; a daily
      // round must also still match today's scheduled answer, otherwise the
      // player would resume yesterday's puzzle after midnight.
      const ok = a && (S.play==="endless" || (S.answer && a.id===S.answer.id));
      if(ok){
        S.answer=a;
        S.guesses = (saved.g||[]).map(id => id==="~skip" ? null : byId(S.mode,id));
        S.skipped = S.guesses.filter(x=>!x).length;
        S.done=!!saved.d; S.won=!!saved.w;
        S.hints = Array.from({length: saved.h || 0}, (_, i) => i);
      }
    }
  }
  buildAudio();
  render();
}

function submitGuess(item){
  if(S.done || !S.answer) return;
  if(item && S.guesses.some(g=>g && g.id===item.id)){
    toast("Already guessed"); return;
  }
  S.guesses.push(item||null);
  if(!item) S.skipped++;

  if(item && item.id===S.answer.id){
    S.done=true; S.won=true;
    recordResult(true, S.guesses.length);
  } else if(S.guesses.length >= MAXG()){
    S.done=true; S.won=false;
    recordResult(false, 0);
  }
  persist();
  render();
  if(S.done){
    stopAudio();
    setTimeout(()=>$("#stage").scrollIntoView({behavior:"smooth",block:"end"}),120);
  } else if(S.mode==="song"){
    playClip();
  }
}

function giveUp(){
  if(S.done||!S.answer) return;
  S.done=true; S.won=false;
  recordResult(false,0);
  persist(); stopAudio(); render();
}

/* ==================================================================
   audio (song mode)
   ================================================================== */
function unlockedSeconds(){
  const wrong = Math.min(S.guesses.length, STEPS.length-1);
  return S.done ? 30 : STEPS[wrong];
}
/* Deezer signs its preview URLs with a short expiry:
     ...mp3?hdnea=exp=1786531003~acl=...~hmac=...
   They die inside the hour, so the URL captured at build time is worthless by
   the time anyone plays the game — it answers 403. The track *id* is stable,
   so the real URL is fetched when the player needs it.

   api.deezer.com sends no Access-Control-Allow-Origin, so fetch() is out.
   It does support JSONP, which is not subject to CORS at all. */
function jsonp(url, ms){
  return new Promise((resolve, reject)=>{
    const cb = "__dz" + (jsonp._n = (jsonp._n||0) + 1);
    const s = document.createElement("script");
    let settled = false;
    const cleanup = ()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                          s.remove(); };
    window[cb] = data => { settled = true; cleanup(); resolve(data); };
    s.onerror = ()=>{ if(!settled){ cleanup(); reject(new Error("network")); } };
    s.src = url + (url.indexOf("?")>=0 ? "&" : "?")
          + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(()=>{ if(!settled){ cleanup(); reject(new Error("timeout")); } },
               ms || 9000);
  });
}

/* Resolve (and remember, for this round) a playable URL for the answer. */
function srcFor(song){
  if(srcFor._id === song.id && srcFor._url) return Promise.resolve(srcFor._url);
  return jsonp("https://api.deezer.com/track/" + song.track)
    .then(t => {
      if(!t || !t.preview) throw new Error("no preview");
      srcFor._id = song.id; srcFor._url = t.preview;
      return t.preview;
    })
    // The build-time URL is almost certainly expired, but if the network is
    // down it is still the only thing we have — better than refusing to try.
    // Catalogue tracks have none at all, so this can legitimately be empty.
    .catch(() => song.preview || null);
}

function buildAudio(){
  stopAudio();
  srcFor._id = srcFor._url = null;
  if(S.mode!=="song" || !S.answer){ S.audio=null; return; }
  const a = new Audio();
  a.preload = "none";
  a.volume = S.volume;
  S.audio = a;
  // Warm the URL up front so the first press plays instead of waiting.
  srcFor(S.answer).then(u => { if(S.audio===a && !a.src) a.src = u; });
}

function playClip(from){
  const song = S.answer;
  if(!S.audio || !song) return;
  const a = S.audio, limit = unlockedSeconds();
  // Replaying a 16-second clip from zero to hear the last two seconds is a
  // waste of the player's time, so playback can start anywhere inside what
  // they have already unlocked — never past it.
  const start = Math.max(0, Math.min(+from || 0, Math.max(limit - 0.25, 0)));
  clearTimeout(playClip._t); clearInterval(playClip._i);
  clearTimeout(playClip._stall);

  S.playing = true;                 // reflect intent immediately
  renderPlayer();
  setPlayNote("Loading…");

  srcFor(song).then(url => {
    if(S.audio !== a || !S.playing) return;
    if(!url){
      stopAudio();
      toast("Could not load the clip — check your connection");
      return;
    }
    if(a.src !== url){ a.src = url; }
    const seek = () => { try{ a.currentTime = start; }catch(e){} };
    seek();
    // A fresh src may not accept a seek until it has metadata.
    if(start > 0 && a.readyState < 1)
      a.addEventListener("loadedmetadata", seek, {once:true});

    // Start the clock when sound actually starts, not when the button was
    // pressed — otherwise a slow load eats the whole one-second clip.
    const begin = ()=>{
      clearTimeout(playClip._stall);
      setPlayNote(null);
      playClip._i = setInterval(()=>{
        if(!S.audio) return;
        if(S.audio.currentTime >= limit) stopAudio(); else renderHead();
      }, 60);
      playClip._t = setTimeout(stopAudio,
                               Math.max(limit - start, 0.2)*1000 + 250);
    };
    a.addEventListener("playing", begin, {once:true});

    playClip._stall = setTimeout(()=>{
      if(S.playing && a.readyState === 0){
        stopAudio();
        toast("Could not load the clip — check your connection");
      }
    }, 9000);

    const p = a.play();
    if(p && p.catch) p.catch(err => {
      clearTimeout(playClip._stall);
      stopAudio();
      // NotAllowedError is the only one a "press play" hint can fix. Anything
      // else is a load failure, and telling the player to press the button
      // they just pressed is worse than saying nothing.
      toast(err && err.name === "NotAllowedError"
        ? "Your browser blocked audio — press ▶ again to allow it"
        : "That clip would not play — try Skip or a new round");
    });
  });
}

function setPlayNote(txt){
  const el = document.getElementById("play-label");
  if(!el) return;
  if(txt){ el.dataset.was = el.dataset.was || el.textContent; el.textContent = txt; }
  else if(el.dataset.was){ el.textContent = el.dataset.was; delete el.dataset.was; }
}

function stopAudio(){
  clearTimeout(playClip._t); clearInterval(playClip._i);
  clearTimeout(playClip._stall);
  if(S.audio){ try{ S.audio.pause(); S.audio.currentTime=0; }catch(e){} }
  S.playing=false;
  setPlayNote(null);
  renderHead(); renderPlayer();
}
function toggleAudio(){ S.playing ? stopAudio() : playClip(); }

/* Click (or arrow-key) anywhere in the unlocked part of the bar to play from
   there. Clicking past the unlocked point clamps rather than doing nothing —
   silently ignoring a click reads as a broken control. */
function seekTo(sec){
  const limit = unlockedSeconds();
  const at = Math.max(0, Math.min(sec, Math.max(limit - 0.25, 0)));
  if(sec > limit) toast("That part is still locked — spend a guess for more");
  stopAudio();
  playClip(at);
}
function wireTrack(){
  const t = $("#track");
  if(!t) return;
  const posOf = e => {
    const r = t.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 30;
  };
  t.onclick = e => seekTo(posOf(e));
  t.onkeydown = e => {
    const step = e.shiftKey ? 5 : 1;
    if(e.key === "ArrowRight"){ e.preventDefault(); seekTo(playHead() + step); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); seekTo(playHead() - step); }
    else if(e.key === "Home"){ e.preventDefault(); seekTo(0); }
  };
}
function playHead(){ return S.audio ? (S.audio.currentTime || 0) : 0; }

/* ==================================================================
   search
   ================================================================== */
function candidates(text){
  const q = norm(text);
  if(!q) return [];
  const pool = CFG().pool();
  const guessed = new Set(S.guesses.filter(Boolean).map(x=>x.id));
  const starts=[], contains=[];
  for(const it of pool){
    if(guessed.has(it.id)) continue;
    let best = -1;
    // it.search is already normalised at build time — see searchable().
    for(const n of it.search){
      if(n.startsWith(q)){ best = 0; break; }
      if(best < 0 && n.indexOf(q) >= 0) best = 1;
    }
    if(best===0) starts.push(it);
    else if(best===1) contains.push(it);
  }
  const key = x => (x.display||x.title||x.name||"");
  starts.sort((a,b)=>key(a).localeCompare(key(b)));
  contains.sort((a,b)=>key(a).localeCompare(key(b)));
  return starts.concat(contains).slice(0,40);
}

let acItems=[], acIdx=-1;
function renderAC(list){
  const box=$("#ac");
  acItems=list; acIdx=list.length?0:-1;
  if(!list.length){
    if(!$("#q").value.trim()){ box.hidden=true; $("#q").setAttribute("aria-expanded","false"); return; }
    box.innerHTML='<div class="empty">No match</div>';
    box.hidden=false; return;
  }
  box.innerHTML = list.map((it,i)=>{
    const th = thumbFor(it);
    const nm = it.display || it.title || it.name;
    const sub = S.mode==="song" ? (it.by ? it.by+" · "+it.group : it.group)
              : S.mode==="group" ? it.company
              : (it.group||"");
    return `<div class="opt" role="option" data-i="${i}"
              aria-selected="${i===acIdx}">
      ${th?`<img class="thumb" src="${esc(th)}" alt="" loading="lazy">`
          :`<div class="thumb"></div>`}
      <div><div class="nm">${esc(nm)}</div>
           <div class="sub">${esc(sub)}</div></div></div>`;
  }).join("");
  box.hidden=false;
  $("#q").setAttribute("aria-expanded","true");
}
function closeAC(){ $("#ac").hidden=true; acItems=[]; acIdx=-1;
  $("#q").setAttribute("aria-expanded","false"); }
function chooseAC(i){
  const it=acItems[i]; if(!it) return;
  $("#q").value=""; closeAC(); submitGuess(it);
}

function renderGauge(){
  const max=MAXG(), n=S.guesses.length;
  let h="";
  for(let i=0;i<max;i++){
    const cls = (S.won && i===n-1) ? "won" : (i<n ? "used" : "");
    h += `<span class="pip ${cls}"></span>`;
  }
  $("#gauge").innerHTML=h;
  $("#count").textContent = S.done
    ? (S.won ? "Solved in "+n : "Out of guesses")
    : (max-n) + (max-n===1 ? " guess left" : " guesses left");
  const st = statsFor(S.mode);
  $("#streak").innerHTML = S.play==="daily"
    ? `streak <b>${st.streak}</b> · best <b>${st.best}</b>` : "endless";
}

function tileHTML(guess, col, res){
  const raw = guess[col.k];
  const val = Array.isArray(raw) ? raw.join(" / ")
            : (col.fmt ? col.fmt(raw) : raw);
  const arrow = res.dir==="up" ? "&uarr;" : res.dir==="down" ? "&darr;" : "";
  // The arrow used to sit behind the value as a watermark, which made both
  // harder to read. It is a line of its own now.
  return `<td><div class="tile ${res.r}">
    <span class="val">${esc(val)}</span>
    ${arrow?`<span class="arrow">${arrow}</span>`:""}</div></td>`;
}

function gridHTML(){
  const cols = CFG().cols;
  const rows = S.guesses.slice().reverse().filter(Boolean).map(g=>{
    const name = g.display || g.name;
    const face = imgTag(g, "face", 160, "");
    const head = `<td><div class="tile name"><div class="who">${face}
        <span>${esc(name)}</span></div></div></td>`;
    return "<tr>"+head+cols.map(c=>tileHTML(g,c,grade(g,S.answer,c))).join("")+"</tr>";
  }).join("");
  if(!rows) return "";
  return `<div class="gridwrap"><table class="grid"><thead><tr>
    <th></th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* The card is in a frosted sleeve and slides down out of it, so the reveal runs
   bottom-up: outfit and hair first, eyes last. A uniform blur would hide the
   same amount of everything; this hands over a real band of the photo per
   guess, which is both fairer and a lot more like holding the thing. */
const SLEEVE_COVER = [88, 74, 58, 42, 24, 10];
/* The frost was a flat 13px, which read as "grey rectangle" rather than "card
   behind plastic". It is gentler now and eases off slightly per guess, so the
   part still inside the sleeve gets a little clearer as well as smaller. */
const SLEEVE_FROST = [6, 5, 4, 3, 2, 1.2];
const SLEEVE_SAT   = [.70, .76, .82, .88, .94, 1];

function imageHTML(){
  const a=S.answer; if(!a) return "";
  const i = Math.min(S.guesses.length, SLEEVE_COVER.length-1);
  const cover = S.done ? 0 : SLEEVE_COVER[i];
  const frost = `--frost:${SLEEVE_FROST[i]}px;--sat:${SLEEVE_SAT[i]}`;
  return `<div class="artstage"><div class="sleeve-wrap">
      <div class="pc">
        ${imgTag(a, "pc-photo", 600, "Photocard of the idol to identify",
                 puzzleSeed())}
      </div>
      <div class="sleeve${S.done?" gone":""}"
           style="--cover:${cover}%;${frost}"></div>
    </div></div>
    <div class="artcap">${S.done
      ? "Photo: Wikimedia Commons"
      : "Each miss pulls the card further out of the sleeve"}</div>`
    + wrongsHTML();
}

    <div class="track" id="track" role="slider" tabindex="0"
         aria-label="Seek inside the unlocked part of the clip"
         aria-valuemin="0" aria-valuemax="${unlocked}"
         aria-valuenow="0" title="Click to play from here">
      <div class="waves"></div>
      <div class="unlocked" id="unl" style="width:${(unlocked/total*100).toFixed(1)}%"></div>
      <div class="ticks">${ticks}</div>
      <div class="head" id="head" style="left:0;opacity:0"></div>
    </div>
    <div class="ticklabels"><span>0:00</span><span>0:30</span></div>
    <div class="playrow">
      <button class="playbtn" id="btn-play" aria-label="Play the clip">
        <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon"
             aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span class="playword" id="play-word">Play</span></button>
      <div class="playinfo">
        <div class="big" id="play-label">${unlocked} second${unlocked===1?"":"s"} unlocked</div>
        <div class="sub">${S.done ? esc(a.group)+" — "+esc(a.title)
                                  : "Which song is this?"}</div>
      </div>
      <div class="vol">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5
                   0 0 0 2.5-4zM14 3v2a7 7 0 0 1 0 14v2a9 9 0 0 0 0-18z"/></svg>
        <input type="range" id="vol" min="0" max="100" step="1"
               value="${Math.round(S.volume*100)}" aria-label="Volume">
      </div>
      <button class="skip" id="btn-skip" ${S.done?"disabled":""}>
        ${S.guesses.length>=MAXG()-1?"Last chance":"Skip +"+
          (STEPS[Math.min(S.guesses.length+1,STEPS.length-1)]-unlocked)+"s"}</button>

}
function renderPlayer(){
  const btn=$("#btn-play"); if(!btn) return;
  $("#play-icon").innerHTML = S.playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  const w=$("#play-word"); if(w) w.textContent = S.playing ? "Stop" : "Play";
  btn.setAttribute("aria-label", S.playing?"Stop the clip":"Play the clip");
}
function renderHead(){
  const h=$("#head"); if(!h||!S.audio) return;
  if(!S.playing){ h.style.opacity="0"; return; }
  h.style.opacity="1";
  h.style.left = Math.min(100, S.audio.currentTime/30*100).toFixed(2)+"%";
}

/* Song and Face give no per-column feedback, so a near miss looks exactly like
   a wild one. Guessing another song by the right artist, or another member of
   the right group, is real progress and now says so. */
function sameArtist(guess){
  if(!S.answer || !guess || guess.id === S.answer.id) return false;
  return (guess.group || null) !== null && guess.group === S.answer.group;
}
function wrongsHTML(){
  const rows = S.guesses.map(g=>{
    if(!g) return `<div class="wrong skipped"><span class="x">&#8594;</span>
      <span>Skipped</span></div>`;
    const th = thumbFor(g);
    const nm = g.display||g.title||g.name;
    const sub = S.mode==="song" ? (g.by ? g.by+" · "+g.group : g.group)
                : (g.group||g.company||"");
    const close = sameArtist(g);
    const note = close
      ? `<span class="closenote">${S.mode==="song"
            ? "right artist" : "right group"}</span>` : "";
    return `<div class="wrong${close?" close":""}">
      <span class="x">${close?"~":"&times;"}</span>
      ${th?`<img src="${esc(th)}" alt="" loading="lazy">`:""}
      <span>${esc(nm)}</span>${note}
      <span class="sub">${esc(sub)}</span></div>`;
  }).reverse().join("");
  return rows ? `<div class="wrongs">${rows}</div>` : "";
}

function factsFor(a){

  if(S.mode==="group")
    return [["Label",a.company],["Debut",a.debut],["Members",a.size],
            ["Gen",ordinal(a.gen)],["Status",a.status]];
  if(S.mode === "song")
    return [["Artist", a.by ? a.by + " of " + a.group : a.group],
            ["From", a.album || "—"]];
  if(a.group === "Soloist")
    return [["Label",a.company],
            ...(a.former ? [["Formerly",a.former]] : []),
            ["From",[].concat(a.nationality).join(" / ")],
            ["Born",a.birth],["Solo debut",a.debut],["Gen",ordinal(a.gen)]];
  return [["Group",a.group],["Label",a.company],
          ["From",[].concat(a.nationality).join(" / ")],
          ["Born",a.birth],["Debut",a.debut],["Gen",ordinal(a.gen)],
          ["Status",a.status]];
}

/* The answer arrives as a photocard — ivory stock, foil-stamped plate, prism
   holo that tracks the pointer the way a real card does under a light. This is
   the only element on the page allowed to be loud. */
function photocardHTML(a){
  if(S.mode==="song")
    return a.art
      ? `<img class="sleeve-art holo" src="${esc(ART(a.art))}" alt="">` : "";
  if(!a.img) return "";
  const isGroup = S.mode==="group";
  const kr = a.kr ? `<div class="pc-kr kr">${esc(a.kr)}</div>` : "";
  // A group card names the group and its label; a member card names her and
  // the group she is in.
  const line2 = isGroup ? shortLabel(a.company||"") : (a.group||"");
  // In Face mode the result must show the photo that was on the card, not a
  // different one — otherwise the reveal does not answer what you were staring
  // at.
  const seed = S.mode === "image" ? puzzleSeed() : null;
  return `<div class="pc holo${isGroup?" wide":""}">
    ${imgTag(a, "pc-photo", isGroup?800:500, "", seed)}
    <div class="pc-plate">${kr}
      <div class="pc-name">${esc(isGroup ? a.name : (a.name||a.display))}</div>
      <div class="pc-group">${esc(line2)}</div>
    </div></div>`;
}

function resultHTML(){
  if(!S.done||!S.answer) return "";
  const a=S.answer;
  const title = S.mode==="song" ? a.title : (a.display||a.name);
  const sub   = S.mode==="song" ? a.group
              : S.mode==="group" ? a.company : a.group;
  const kr = a.kr || (ownerOf(a) || {}).kr;
  const krLine = kr ? ` <span class="kr">${esc(kr)}</span>` : "";
  const facts = factsFor(a).map(([k,v])=>
    `<span class="fact"><b>${esc(k)}</b>${esc(v)}</span>`).join("");
  return `<div class="result">
    <div class="result-inner">
      ${photocardHTML(a)}
      <div class="result-body">
        <div class="verdict ${S.won?"win":"lose"}">
          ${S.won ? "Solved in "+S.guesses.length
                  : "Out of guesses — it was"}</div>
        <h2>${esc(title)}</h2>
        <div class="sub">${esc(sub)}${krLine}</div>
        <div class="factlist">${facts}</div>
        <div class="actions">
          <button class="ghost" id="btn-copy">Copy result</button>
          <button class="ghost" id="btn-again">
            ${S.play==="daily" ? "Keep playing" : "Next round"}</button>
        </div>
      </div>
    </div></div>`;
}

function shareText(){
  const names={member:"Idol",group:"Group",image:"Face",song:"Song"};
  const head = `K-poppedle ${names[S.mode]} #${S.day} `
    + (S.won ? S.guesses.length+"/"+MAXG() : "X/"+MAXG());
  let grid="";
  if(CFG().kind==="grid"){
    grid = S.guesses.filter(Boolean).map(g=>CFG().cols.map(c=>{
      const r=grade(g,S.answer,c).r;
      return r==="hit"?"🟩":r==="near"?"🟨":"⬛";
    }).join("")).join("\n");
  } else {
    grid = S.guesses.map((g,i)=>
      (S.won && i===S.guesses.length-1) ? "🟩" : (g?"🟥":"⬜")).join("");
  }
  return head+"\n"+grid;
}
function copyShare(){
  const t=shareText();
  const done = ()=>toast("Copied");
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(t,cb){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){ toast("Copy failed"); }
  ta.remove();
}

/* ==================================================================
   how to play

   Generated from the live data rather than written out, so the counts cannot
   drift from what the game actually holds and the column table always matches
   the mode you are looking at.
   ================================================================== */
const COLUMN_HELP = {
  group:  ["Her group. A soloist shows <b>Soloist</b>.",
           "never — right or wrong"],
  company:["The label the group debuted under.",
           "a <i>different</i> label under the same parent — Source Music and ADOR are both HYBE"],
  nationality:["Every citizenship on record, so dual nationals show both.",
           "the two sets overlap without matching"],
  gen:    ["K-pop generation, taken from the debut year.",
           "never. 3rd and 4th are not “close” — the arrow already says which way"],
  size:   ["How many members the group <b>debuted</b> with, not how many are left today.",
           "within 1"],
  debut:  ["The year the group debuted. For a soloist, her solo debut.",
           "within 2 years"],
  birth:  ["Her birth year.", "within 2 years"],
  status: ["<b>Active</b>, <b>Left</b>, <b>Disbanded</b>, <b>Inactive</b> or <b>Soloist</b>. Leaving the group wins over the group disbanding.",
           "never"],
  foreign:["How many members are not South Korean.", "within 1"],
};

  const cols = CFG().cols;
  const which = S.mode === "group" ? "Group" : "Idol";

  const table = cols ? '<table class="helpcols"><tbody>' + cols.map(c => {
      const h = COLUMN_HELP[c.k] || ["", ""];
      return '<tr><th>' + esc(c.label) + '</th><td>' + h[0] +
             '<div class="amber">amber: ' + h[1] + '</div></td></tr>';
    }).join("") + '</tbody></table>' : "";

  const colsBlock = cols
    ? '<h3>What the columns mean</h3><p class="note">Showing the ' + which +
      ' grid. Amber always means one specific thing — it is never a vague ' +
      'nudge.</p>' + table
    : '<h3>No columns here</h3><p class="note">Face and Song are ' +
      'all-or-nothing, so each offers three <b>hints</b>. A hint costs a ' +
      'guess, and you cannot spend your last one on it. A wrong guess that ' +
      'still names the right artist or group is marked, because that is real ' +
      'progress.</p>';

  return '<h2>How to play</h2><span class="kr">놀이 방법</span>' +

    '<div class="legend">' +
      '<div><span class="sw hit"></span> Exact match.</div>' +
      '<div><span class="sw near"></span> Close — what that means depends ' +
        'on the column.</div>' +
      '<div><span class="sw"></span> No match. On number columns the arrow ' +
        'points from your guess toward the answer.</div>' +
    '</div>' +

    '<h3>The four puzzles</h3>' +
    '<div class="helpmode"><b>Idol</b> <span class="kr">아이돌</span> Name the ' +
      'idol. Eight columns of feedback, eight guesses. Soloists are in this ' +
      'pool too.</div>' +
    '<div class="helpmode"><b>Group</b> <span class="kr">그룹</span> Name the ' +
      'group. Six columns, eight guesses.</div>' +
    '<div class="helpmode"><b>Face</b> <span class="kr">얼굴</span> A photocard ' +
      'in a frosted sleeve. Each miss slides it further out, revealing another ' +
      'band from the bottom up — so you get the outfit and hair first and ' +
      'the eyes last. Six guesses.</div>' +
    '<div class="helpmode"><b>Song</b> <span class="kr">노래</span> Name the ' +
      'track. You hear 1 second, then 2, 4, 7, 11 and 16 as you miss. ' +
      'Skipping costs a guess and buys the next step.</div>' +

    colsBlock +

    '<h3>Daily and Endless</h3>' +
    '<p><b>Daily</b> <span class="kr">오늘</span> is the same puzzle for ' +
      'everyone and resets at midnight in your own timezone. It leans toward ' +
      'groups you would recognise, and in Song mode it only ever asks for a ' +
      'title track — a shared daily built on an album cut nobody has heard ' +
      'would not be fair. Only Daily counts toward your streak.</p>' +
    '<p><b>Endless</b> <span class="kr">무한</span> plays the whole pool, ' +
      'B-sides and deep cuts included, and unlocks the filters: generation, ' +
      'fame, specific groups, whether to include members who left and ' +
      'disbanded groups, and a switch to stay on title tracks. Filters never ' +
      'touch Daily.</p>' +

    '<h3>What is in the game</h3>' +
    '<p><b>' + nMembers + '</b> members across <b>' + DATA.groups.length +
      '</b> groups, <b>' + nSolo + '</b> soloists and <b>' +
      DATA.songs.length.toLocaleString("en") + '</b> tracks. Songs come from ' +
      'each artist’s full discography, so album cuts, B-sides and ' +
      'Japanese releases are all there — as are solo releases by members ' +
      'and sub-units such as MISAMO, filed under their group and findable ' +
      'under either name.</p>' +
    '<p class="note">Girl groups, 3rd generation onward; soloists reach back ' +
      'to the 2nd. Facts from Wikidata, portraits from Wikimedia Commons, ' +
      '30-second previews from Deezer.</p>';
}

function statsHTML(){
  const s=statsFor(S.mode);
  const pct = s.played ? Math.round(s.won/s.played*100) : 0;
  const names={member:"Idol",group:"Group",image:"Face",song:"Song"};
  const max = Math.max(1,...Object.values(s.dist));
  const bars = Array.from({length:MAXG()},(_,i)=>{
    const n=s.dist[i+1]||0;
    return `<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
      <span style="width:14px;color:var(--dim);font-size:12px">${i+1}</span>
      <div style="flex:1;background:var(--miss);border-radius:5px;height:18px">
        <div style="width:${Math.max(n?12:0,n/max*100)}%;height:100%;
          background:linear-gradient(90deg,var(--accent),var(--accent2));
          border-radius:5px;text-align:right;color:#fff;font-size:11px;
          padding-right:5px;line-height:18px">${n||""}</div></div></div>`;
  }).join("");
  return `<p style="margin-top:0">Daily &middot; ${esc(names[S.mode])}</p>
    <div class="statgrid">
      <div class="stat"><b>${s.played}</b><span>played</span></div>
      <div class="stat"><b>${pct}%</b><span>win rate</span></div>
      <div class="stat"><b>${s.streak}</b><span>streak</span></div>
      <div class="stat"><b>${s.best}</b><span>best</span></div>
    </div>
    <p style="margin-bottom:4px">Guess distribution</p>${bars}`;
}

/* ==================================================================
   wiring
   ================================================================== */
/* Holo tilt: the foil sweep follows the pointer across the card. Without a
   pointer it just sits at rest — the ambient sway in CSS carries it. */
/* ==================================================================
   hints

   Face and Song give no per-column feedback, so a player who is stuck is
   simply stuck — there is nothing to reason from. A hint costs a guess, which
   keeps it a real decision rather than a free win, and each one names a fact
   that narrows the field without giving the answer away.
   ================================================================== */
const HINTS = {
  image: [
    {label:"Generation", of:a => ordinal(a.gen)},
    {label:"Label",      of:a => shortLabel(a.company)},
    {label:"From",       of:a => [].concat(a.nationality).join(" / ")},
  ],
  song: [
    // Read from the track if it carries a generation, else from its artist —
    // which of the two holds it differs by branch.
    {label:"Generation", of:a => {
      const g = a.gen != null ? a.gen : (groupByName[a.group] || {}).gen;
      return g != null ? ordinal(g) : "—"; }},
    {label:"Released",   of:a => a.year || "—"},
    {label:"Release",    of:a => a.album || "—"},
  ],
};
function hintsFor(){ return HINTS[S.mode] || []; }
function takeHint(){
  const list = hintsFor();
  if(S.done || S.hints.length >= list.length) return;
  if(S.guesses.length >= MAXG() - 1){
    toast("Not enough guesses left to spend one");
    return;
  }
  S.hints.push(S.hints.length);
  S.guesses.push(null);          // a hint costs a guess, like a skip
  persist();
  render();
}
function hintsHTML(){
  const list = hintsFor();
  if(!list.length) return "";
  const shown = list.slice(0, S.hints.length).map((h, i) =>
    `<span class="hint"><b>${esc(h.label)}</b>${esc(h.of(S.answer))}</span>`
  ).join("");
  const left = list.length - S.hints.length;
  const btn = (S.done || !left) ? "" :
    `<button class="chip" id="btn-hint">Reveal ${esc(list[S.hints.length].label)}
       <span class="cost">costs a guess</span></button>`;
  return `<div class="hints">${shown}${btn}</div>`;
}

/* ==================================================================
   filter panel
   ================================================================== */
function toggleIn(list, v){
  const i = list.indexOf(v);
  if(i >= 0) list.splice(i, 1); else list.push(v);
}
function applyFilters(){
  saveFilters();
  if(S.play === "endless") startRound(false);
  else renderFilters();
}

let groupListOpen = false;
/* ==================================================================
   archive — replay any past daily
   ================================================================== */
function archiveDays(){
  // Only days that have actually happened, newest first, and only as far back
  // as the schedule goes.
  const len = (DATA.schedules[S.mode] || []).length;
  const n = Math.max(0, Math.min(S.day, len ? len - 1 : 0));
  return Array.from({length: n}, (_, i) => S.day - 1 - i);
}
function dayDate(d){
  const [y,m,dd] = DATA.epoch.split("-").map(Number);
  return new Date(y, m-1, dd + d);
}
function monthLabel(d){
  return dayDate(d).toLocaleDateString("en-GB",
                                       {month:"long", year:"numeric"});
}
function dayNum(d){ return String(dayDate(d).getDate()); }
function dayLabel(d){
  const [y,m,dd] = DATA.epoch.split("-").map(Number);
  const dt = new Date(y, m-1, dd + d);
  // Pinned to English rather than the browser locale: the rest of the
  // interface is English, and a Hebrew or Japanese date sitting between "#222"
  // and an English button reads as a rendering fault.
  return dt.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}
function dayState(d){
  const r = (loadStore().rounds || {})[S.mode + ":d" + d];
  return r && r.d ? (r.w ? "won" : "lost") : "";
}

/* The full picker, behind the Past days button. A permanent strip of sixty
   chips took up the top of the board for something you reach for occasionally. */
function renderArchiveDialog(){
  const days = archiveDays();
  const cur = shownDay();
  const played = days.filter(d => dayState(d)).length;
  $("#archive-note").textContent = days.length
    ? `Every past day has a fixed answer. ${played} of ${days.length} played — `
      + `replaying one never touches your streak.`
    : "Nothing to replay yet — come back tomorrow.";
  // 223 bare numbers is a wall. Grouped by month, a player can find "the one
  // from last Tuesday" without hovering every chip for its tooltip.
  const months = [];
  days.forEach(d => {
    const m = monthLabel(d);
    if(!months.length || months[months.length-1].m !== m)
      months.push({m, days: []});
    months[months.length-1].days.push(d);
  });
  $("#archive-grid").innerHTML = `
    <div class="daygrid">
      <button class="chip" data-today="1" aria-pressed="${S.viewDay==null}">
        Today</button>
    </div>
    ${months.map(g => `<div class="monthblock">
      <div class="monthlab">${esc(g.m)}</div>
      <div class="daygrid">${g.days.map(d =>
        `<button class="chip day ${dayState(d)}" data-day="${d}"
           aria-pressed="${cur===d}" title="#${d} · ${esc(dayLabel(d))}"
           >${esc(dayNum(d))}</button>`).join("")}</div>
    </div>`).join("")}`;
  const pick = fn => { fn(); $("#dlg-archive").close(); startRound(true); };
  $("#archive-grid").querySelector("[data-today]").onclick =
    () => pick(() => { S.viewDay = null; });
  $("#archive-grid").querySelectorAll("[data-day]").forEach(b =>
    b.onclick = () => pick(() => { S.viewDay = +b.dataset.day; }));
}

/* Inline, the strip appears only while you are actually replaying a past day —
   so there is always an obvious way back to today and a way to step between
   days without reopening the dialog. */
function renderArchive(){
  const host = $("#archive");
  if(S.play !== "daily" || S.viewDay == null){ host.innerHTML = ""; return; }
  const days = archiveDays();
  const cur = shownDay();
  const near = days.filter(d => Math.abs(d - cur) <= 6);
  host.innerHTML = `<div class="archive">
    <button class="chip" id="a-today">&larr; Today</button>
    <div class="days">${near.map(d =>
      `<button class="chip day ${dayState(d)}" data-day="${d}"
               aria-pressed="${cur===d}">#${d} · ${esc(dayLabel(d))}</button>`
      ).join("")}</div>
    <button class="chip" id="a-more">All days</button>
  </div>`;
  $("#a-today").onclick = () => { S.viewDay = null; startRound(true); };
  $("#a-more").onclick = () => {
    renderArchiveDialog(); $("#dlg-archive").showModal();
  };
  host.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    S.viewDay = +b.dataset.day;
    startRound(true);
  });
}

function renderFilters(){
  const host = $("#filters");
  if(S.play !== "endless" || !S.filters){ host.innerHTML = ""; return; }
  const f = S.filters;
  const kept = CFG().pool().filter(x => passes(x, f));
  const noun = S.mode === "song" ? "song" : S.mode === "group" ? "group" : "idol";
  const groups = [...new Set(kept.map(x => x.group || x.name))].length;

  const chip = (on, label, attrs) =>
    `<button class="chip" aria-pressed="${on}" ${attrs}>${esc(label)}</button>`;

  /* Groups are ordered by tier then name, so the big names sit at the top of
     the list instead of being buried alphabetically among the deep cuts. */
  const sorted = DATA.groups.slice().sort((a, b) =>
    a.tier - b.tier || a.name.localeCompare(b.name));
  // Soloists are not a group, but they are a thing a player wants to filter to.
  if(DATA.members.some(m => m.group === "Soloist"))
    sorted.unshift({name:"Soloist", tier:1});

  host.innerHTML = `<div class="filters">
    <div class="frow">
      <span class="flab">Quick pick</span>
      ${PINNED.map(n => chip(f.groups.indexOf(n) >= 0, n,
          `data-group="${esc(n)}" class="chip pin"`)).join("")}
      <button class="chip" id="f-groups" aria-pressed="${f.groups.length > 0}">
        Groups${f.groups.length ? " · " + f.groups.length : ""}</button>
      <button class="ghost" id="f-reset">Reset</button>
    </div>
    <div class="grouplist" id="f-grouplist" ${groupListOpen || f.groups.length ? "" : "hidden"}>
      ${sorted.map(g => chip(f.groups.indexOf(g.name) >= 0, g.name,
          `data-group="${esc(g.name)}"`)).join("")}
    </div>
    <div class="frow">
      <span class="flab">Generation</span>
      ${GENS.map(g => chip(f.gens.indexOf(g) >= 0, ordinal(g),
          `data-gen="${g}"`)).join("")}
      <span class="flab" style="min-width:auto;margin-left:8px">Fame</span>
      ${TIERS.map(t => chip(f.tiers.indexOf(t.v) >= 0, t.label,
          `data-tier="${t.v}"`)).join("")}
    </div>
    <div class="frow">
      <span class="flab">Include</span>
      ${chip(f.former, "Members who left", 'id="f-former"')}
      ${chip(f.disbanded, "Disbanded groups", 'id="f-disbanded"')}
      ${S.mode === "song"
        ? chip(f.singlesOnly, "Title tracks only", 'id="f-singles"') : ""}
    </div>
    <div class="count-line ${kept.length ? "" : "empty"}">${
      kept.length
        ? `<b>${kept.length}</b> ${noun}${kept.length === 1 ? "" : "s"} from
           <b>${groups}</b> group${groups === 1 ? "" : "s"} can come up in endless`
        : "Nothing matches — endless will use everyone until you widen this"
    }</div>
  </div>`;

  host.querySelectorAll("[data-group]").forEach(b => b.onclick = () => {
    toggleIn(f.groups, b.dataset.group); applyFilters();
  });
  host.querySelectorAll("[data-gen]").forEach(b => b.onclick = () => {
    toggleIn(f.gens, +b.dataset.gen); applyFilters();
  });
  host.querySelectorAll("[data-tier]").forEach(b => b.onclick = () => {
    toggleIn(f.tiers, +b.dataset.tier); applyFilters();
  });
  $("#f-former").onclick    = () => { f.former = !f.former; applyFilters(); };
  $("#f-disbanded").onclick = () => { f.disbanded = !f.disbanded; applyFilters(); };
  const singles = $("#f-singles");
  if(singles) singles.onclick = () => { f.singlesOnly = !f.singlesOnly; applyFilters(); };
  $("#f-reset").onclick     = () => { S.filters = defaultFilters(); applyFilters(); };
  $("#f-groups").onclick    = () => {
    groupListOpen = !groupListOpen;
    const list = $("#f-grouplist");
    list.hidden = !(groupListOpen || f.groups.length);
    $("#f-groups").setAttribute("aria-pressed",
      String(!list.hidden || f.groups.length > 0));
  };
}

function wireHolo(){
  document.querySelectorAll(".holo").forEach(el=>{
    el.onpointermove = e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--hx", (((e.clientX-r.left)/r.width -.5)*90).toFixed(1)+"%");
      el.style.setProperty("--hy", (((e.clientY-r.top)/r.height -.5)*90).toFixed(1)+"%");
    };
    el.onpointerleave = () => {
      el.style.removeProperty("--hx"); el.style.removeProperty("--hy");
    };
  });
}

/* The right-hand fade means "there is more to scroll". Once there isn't, it
   should stop lying. */
function wireGridScroll(){
  const w = document.querySelector(".gridwrap");
  if(!w) return;
  const sync = () => w.classList.toggle(
    "at-end", w.scrollLeft + w.clientWidth >= w.scrollWidth - 2);
  w.onscroll = sync;
  sync();
}

function wire(){
  wireHolo();
  wireGridScroll();
  wireTrack();
  const play=$("#btn-play");
  if(play){
    play.onclick=toggleAudio;
    const skip=$("#btn-skip");
    if(skip) skip.onclick=()=>submitGuess(null);
  }
  const vol=$("#vol");
  if(vol) vol.oninput = e => setVolume(+e.target.value / 100);
  const hint=$("#btn-hint"); if(hint) hint.onclick=takeHint;
  const copy=$("#btn-copy"); if(copy) copy.onclick=copyShare;
  const again=$("#btn-again");
  if(again) again.onclick=()=>{
    if(S.play==="daily"){ setPlay("endless"); }
    else startRound(false);
  };
}

function setMode(m){
  if(S.mode===m) return;
  stopAudio();
  S.mode=m;
  ["member","group","image","song"].forEach(x=>
    $("#m-"+x).setAttribute("aria-pressed", String(x===m)));
  startRound(true);
}
function setPlay(p){
  stopAudio();
  if(p !== "daily") S.viewDay = null;
  S.play=p;
  ["daily","endless"].forEach(x=>
    $("#p-"+x).setAttribute("aria-pressed", String(x===p)));
  startRound(true);
}

function init(){
  initTheme();
  S.volume = loadVolume();
  S.filters = loadFilters();
  DATA.groups.forEach(g => { groupByName[g.name] = g; });
  // Soloists are filed under their own name, so their tracks have no group to
  // read a generation or tier from. Register them as their own owner.
  DATA.members.filter(m => m.group === "Soloist").forEach(m => {
    groupByName[m.name] = {name:m.name, gen:m.gen, tier:m.tier,
                           status:"Active", kr:m.kr, soloist:true};
  });
  ["member","group","image","song"].forEach(m=>
    $("#m-"+m).onclick=()=>setMode(m));
  ["daily","endless"].forEach(p=>
    $("#p-"+p).onclick=()=>setPlay(p));
  $("#btn-new").onclick=()=>startRound(false);
  $("#btn-give").onclick=giveUp;
  $("#btn-help").onclick=()=>{
    $("#help-body").innerHTML = helpHTML();
    $("#dlg-help").showModal();
  };
  $("#btn-archive").onclick=()=>{
    renderArchiveDialog(); $("#dlg-archive").showModal();
  };
  $("#btn-stats").onclick=()=>{
    $("#stats-body").innerHTML=statsHTML(); $("#dlg-stats").showModal(); };
  $("#btn-share").onclick=copyShare;
  document.querySelectorAll("[data-close]").forEach(b=>
    b.onclick=e=>e.target.closest("dialog").close());

  const q=$("#q");
  q.addEventListener("input",()=>renderAC(candidates(q.value)));
  q.addEventListener("focus",()=>{ if(q.value) renderAC(candidates(q.value)); });
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      if(!acItems.length) return;
      acIdx=(acIdx+(e.key==="ArrowDown"?1:-1)+acItems.length)%acItems.length;
      renderACSelection();
    } else if(e.key==="Enter"){
      e.preventDefault();
      if(acIdx>=0) chooseAC(acIdx);
      else { const c=candidates(q.value); if(c.length===1) { acItems=c; chooseAC(0); } }
    } else if(e.key==="Escape"){ closeAC(); }
  });
  $("#ac").addEventListener("mousedown",e=>{
    const opt=e.target.closest(".opt"); if(!opt) return;
    e.preventDefault(); chooseAC(+opt.dataset.i);
  });
  $("#submit").onclick=()=>{
    if(acIdx>=0 && acItems.length) chooseAC(acIdx);
    else { const c=candidates(q.value); if(c.length) { acItems=c; chooseAC(0); }
           else toast("No match"); }
  };
  document.addEventListener("click",e=>{
    if(!e.target.closest(".field")) closeAC();
  });
  document.addEventListener("keydown",e=>{
    if(e.key===" " && S.mode==="song" && document.activeElement!==q
       && !document.querySelector("dialog[open]")){
      e.preventDefault(); toggleAudio();
    }
  });

  if(!loadStore().seen){
    const st=loadStore(); st.seen=1; saveStore(st);
    $("#help-body").innerHTML = helpHTML();
    $("#dlg-help").showModal();
  }
  startRound(true);
}
function renderACSelection(){
  $("#ac").querySelectorAll(".opt").forEach((o,i)=>
    o.setAttribute("aria-selected", String(i===acIdx)));
  const sel=$("#ac").querySelector('[aria-selected="true"]');
  if(sel) sel.scrollIntoView({block:"nearest"});
}

if(typeof module!=="undefined" && module.exports){
  module.exports = {DATA,S,MODES,MEMBER_COLS,GROUP_COLS,grade,gNum,gSet,ordinal,shortLabel,
                    gCompany,gExact,norm,candidates,dailyAnswer,unlockedSeconds,
                    STEPS,shareText,startRound,submitGuess,
                    THEMES,defaultFilters,passes,endlessPool,groupByName,
                    PINNED,SLEEVE_COVER,SLEEVE_FROST,SLEEVE_SAT,loadVolume,
                    photoOf,commons,HINTS,hintsFor,takeHint,MAXG,
                    loadFilters,photoSeed,puzzleSeed,thumbFor,pickerPhoto,seekTo,
                    playClip,shownDay,archiveDays,dayLabel,renderArchiveDialog,dayState,monthLabel,dayNum};
} else {
  document.addEventListener("DOMContentLoaded",init);
}
</script>
